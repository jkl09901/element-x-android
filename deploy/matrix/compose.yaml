name: tolkomy-matrix

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Run setup.sh first}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  synapse:
    image: matrixdotorg/synapse:v1.163.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./synapse-data:/data
    ports:
      # Not accessible from the public internet. Nginx forwards HTTPS to it.
      - '127.0.0.1:18008:8008'
    networks: [private]

networks:
  private:
    internal: false

volumes:
  postgres-data:
