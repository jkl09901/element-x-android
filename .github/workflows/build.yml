# Mobile-friendly test build for the "Tolko My" fork.
# Original upstream APK Build workflow is preserved on the develop branch.
name: APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  build:
    name: Tolko My - F-Droid Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Android build environment
        uses: ./.github/actions/setup-build
        with:
          free-disk-space: 'true'
          gradle-cache-read-only: 'true'
      - name: Build test APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace --no-configuration-cache
      - name: Upload test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TolkoMy-Fdroid-Debug-APK
          path: app/build/outputs/apk/fdroid/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
